name: OAuth

on: push

jobs:
  client:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
        working-directory: ./client
      - run: npm run types
        working-directory: ./client

  authorization-server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
        working-directory: ./authorization-server
      - run: npm run types
        working-directory: ./authorization-server
      - run: npm test
        working-directory: ./authorization-server
